<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a12">
<title>PLUG THE LEAKS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #0a0a12; font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  #game { display: block; width: 100vw; height: 100vh; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(10,10,18,.92); z-index: 10; padding: 24px; text-align: center; }
  .overlay[hidden] { display: none; }
  .overlay h1 { font-size: 2.2rem; font-weight: 900; letter-spacing: 1px; margin-bottom: 8px;
    background: linear-gradient(90deg, #4ade80, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .overlay p { color: #a8a8b8; font-size: 1rem; line-height: 1.6; max-width: 340px; margin-bottom: 20px; }
  .overlay .score-big { font-size: 3.5rem; font-weight: 900; color: #4ade80; margin: 8px 0; }
  .overlay .rank { font-size: 1.3rem; font-weight: 800; color: #a855f7; margin-bottom: 12px; }
  .big-btn { display: block; width: 100%; max-width: 320px; padding: 18px; font-size: 1.15rem; font-weight: 900; border: 0; border-radius: 16px; cursor: pointer; text-decoration: none; text-align: center; margin-bottom: 12px; }
  .btn-go { background: linear-gradient(90deg, #4ade80, #22c55e); color: #06210f; }
  .btn-cta { background: linear-gradient(90deg, #a855f7, #ec4899); color: #fff; }
  .btn-quiet { background: transparent; color: #a8a8b8; border: 1px solid #33334a; font-size: .95rem; padding: 12px; }
  .howto { text-align: left; color: #c8c8d8; font-size: .92rem; line-height: 1.9; max-width: 320px; margin-bottom: 22px; }
  .howto b { color: #4ade80; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="overlay" id="start-screen">
  <h1>PLUG THE LEAKS</h1>
  <div class="howto">
    🧑 Customers walk to your shop.<br>
    🕳️ <b>Leaks open</b> — tap them to plug!<br>
    😱 Unplugged leaks <b>swallow customers</b>.<br>
    ⏱️ 60 seconds. Save as many as you can.
  </div>
  <button class="big-btn btn-go" id="start-btn">START</button>
</div>

<div class="overlay" id="end-screen" hidden>
  <h1 id="end-title">TIME!</h1>
  <div class="score-big" id="end-score">0</div>
  <p style="margin-bottom:4px">customers saved</p>
  <div class="rank" id="end-rank"></div>
  <p>Your real business leaks customers the same way.<br>Get a <b style="color:#4ade80">FREE</b> leak check.</p>
  <a class="big-btn btn-cta" href="https://xavierhoolulu13-dotcom.github.io/tentcity/growth-plan.html">Get My Free Leak Check</a>
  <button class="big-btn btn-quiet" id="again-btn">Play again</button>
</div>

<script>
(function() {
  'use strict';
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W, H, laneY, shopX;
  var DPR = Math.min(window.devicePixelRatio || 1, 2);

  var LEAK_LABELS = ['No website', 'No reviews', 'Missed call', 'Slow reply', 'No Google listing'];
  var GAME_LEN = 60;

  var running = false, startTime = 0, elapsed = 0;
  var customers = [], leaks = [], particles = [];
  var score = 0, plugged = 0, lost = 0;
  var lastCustSpawn = 0, lastLeakSpawn = 0;

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    laneY = H * 0.55; shopX = W - 70;
  }
  window.addEventListener('resize', resize); resize();

  function rand(a, b) { return a + Math.random() * (b - a); }

  function spawnCustomer() {
    customers.push({ x: -30, y: laneY + rand(-24, 24), speed: rand(55, 85), state: 'walk', t: 0, sinkY: 0 });
  }
  function spawnLeak() {
    if (leaks.filter(function(l){ return !l.gone; }).length >= 4) return;
    var x = rand(W * 0.25, W * 0.72);
    // don't stack on another leak
    for (var i = 0; i < leaks.length; i++) {
      if (!leaks[i].gone && Math.abs(leaks[i].x - x) < 90) return;
    }
    leaks.push({ x: x, label: LEAK_LABELS[Math.floor(Math.random() * LEAK_LABELS.length)],
      plugged: false, gone: false, born: elapsed, wob: Math.random() * 6.28 });
  }
  function burst(x, y, color, n) {
    for (var i = 0; i < (n || 10); i++) {
      particles.push({ x: x, y: y, vx: rand(-160, 160), vy: rand(-220, -40), life: rand(0.4, 0.9), t: 0, color: color, r: rand(2, 5) });
    }
  }

  function plugAt(px, py) {
    for (var i = 0; i < leaks.length; i++) {
      var l = leaks[i];
      if (!l.gone && !l.plugged && Math.hypot(l.x - px, laneY - py) < 55) {
        l.plugged = true; l.plugT = 0; plugged++;
        burst(l.x, laneY, '#4ade80', 12);
        return true;
      }
    }
    return false;
  }
  canvas.addEventListener('pointerdown', function(e) {
    if (!running) return;
    var r = canvas.getBoundingClientRect();
    plugAt(e.clientX - r.left, e.clientY - r.top);
  });

  function update(dt) {
    elapsed = (performance.now() - startTime) / 1000;
    if (elapsed >= GAME_LEN) { endGame(); return; }

    if (elapsed - lastCustSpawn > 1.05) { spawnCustomer(); lastCustSpawn = elapsed; }
    if (elapsed - lastLeakSpawn > 2.4) { spawnLeak(); lastLeakSpawn = elapsed; }

    for (var i = customers.length - 1; i >= 0; i--) {
      var c = customers[i]; c.t += dt;
      if (c.state === 'walk') {
        c.x += c.speed * dt;
        // check leaks
        for (var j = 0; j < leaks.length; j++) {
          var l = leaks[j];
          if (!l.gone && !l.plugged && Math.abs(c.x - l.x) < 24 && Math.abs(c.y - laneY) < 40) {
            c.state = 'fall'; c.t = 0; lost++;
            burst(c.x, laneY, '#f87171', 10);
            break;
          }
        }
        if (c.x >= shopX - 18) {
          c.state = 'saved'; c.t = 0; score++;
          burst(shopX - 10, c.y, '#4ade80', 8);
        }
      } else if (c.state === 'fall') {
        c.sinkY += 260 * dt;
        if (c.t > 0.45) customers.splice(i, 1);
      } else if (c.state === 'saved') {
        if (c.t > 0.35) customers.splice(i, 1);
      }
    }

    for (var k = leaks.length - 1; k >= 0; k--) {
      var lk = leaks[k];
      if (lk.plugged) { lk.plugT += dt; if (lk.plugT > 1.4) { lk.gone = true; } }
      else if (elapsed - lk.born > 9) { lk.gone = true; } // leak seals itself after 9s
      if (lk.gone) leaks.splice(k, 1);
    }

    for (var p = particles.length - 1; p >= 0; p--) {
      var pt = particles[p]; pt.t += dt;
      pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 500 * dt;
      if (pt.t > pt.life) particles.splice(p, 1);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // bg glow
    var g = ctx.createRadialGradient(W/2, laneY, 40, W/2, laneY, W*0.7);
    g.addColorStop(0, '#141422'); g.addColorStop(1, '#0a0a12');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // lane
    ctx.fillStyle = '#16161f';
    ctx.fillRect(0, laneY - 46, shopX, 92);
    ctx.strokeStyle = '#2a2a3d'; ctx.lineWidth = 2;
    ctx.setLineDash([14, 12]);
    ctx.beginPath(); ctx.moveTo(0, laneY); ctx.lineTo(shopX, laneY); ctx.stroke();
    ctx.setLineDash([]);

    // shop
    ctx.font = '52px serif'; ctx.textAlign = 'center';
    ctx.fillText('🏪', shopX + 22, laneY + 18);
    ctx.font = '700 13px -apple-system, sans-serif'; ctx.fillStyle = '#4ade80';
    ctx.fillText('YOUR SHOP', shopX + 22, laneY + 44);

    // leaks
    for (var i = 0; i < leaks.length; i++) {
      var l = leaks[i];
      l.wob += 0.06;
      var wobX = Math.sin(l.wob) * 3;
      if (l.plugged) {
        ctx.fillStyle = 'rgba(74,222,128,.25)';
        ctx.beginPath(); ctx.arc(l.x, laneY, 30, 0, 6.29); ctx.fill();
        ctx.fillStyle = '#4ade80'; ctx.font = '900 30px -apple-system, sans-serif';
        ctx.fillText('✓', l.x, laneY + 11);
      } else {
        // hole
        var hg = ctx.createRadialGradient(l.x + wobX, laneY, 4, l.x + wobX, laneY, 34);
        hg.addColorStop(0, '#000'); hg.addColorStop(0.7, '#1a0a2e'); hg.addColorStop(1, 'rgba(168,85,247,.55)');
        ctx.fillStyle = hg;
        ctx.beginPath(); ctx.ellipse(l.x + wobX, laneY, 34, 22, 0, 0, 6.29); ctx.fill();
        ctx.strokeStyle = '#a855f7'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.ellipse(l.x + wobX, laneY, 34, 22, 0, 0, 6.29); ctx.stroke();
        // label
        ctx.font = '800 12px -apple-system, sans-serif';
        var tw = ctx.measureText(l.label).width;
        ctx.fillStyle = 'rgba(10,10,18,.85)';
        var bx = l.x + wobX, by = laneY - 58;
        ctx.fillRect(bx - tw/2 - 8, by - 14, tw + 16, 22);
        ctx.strokeStyle = '#f87171'; ctx.lineWidth = 1.5;
        ctx.strokeRect(bx - tw/2 - 8, by - 14, tw + 16, 22);
        ctx.fillStyle = '#fca5a5'; ctx.fillText(l.label, bx, by + 2);
        // pulsing "TAP" hint
        var pulse = 0.6 + 0.4 * Math.sin(l.wob * 2);
        ctx.globalAlpha = pulse; ctx.fillStyle = '#a855f7';
        ctx.font = '800 11px -apple-system, sans-serif';
        ctx.fillText('TAP!', l.x + wobX, laneY + 44);
        ctx.globalAlpha = 1;
      }
    }

    // customers
    ctx.font = '30px serif';
    for (var c = 0; c < customers.length; c++) {
      var cu = customers[c];
      var bob = Math.sin(cu.t * 10) * 3;
      if (cu.state === 'fall') {
        ctx.globalAlpha = Math.max(0, 1 - cu.t * 2);
        ctx.fillText('😱', cu.x, cu.y + bob + cu.sinkY);
        ctx.globalAlpha = 1;
      } else if (cu.state === 'saved') {
        ctx.globalAlpha = Math.max(0, 1 - cu.t * 2.5);
        ctx.fillText('🤩', cu.x, cu.y + bob - cu.t * 40);
        ctx.globalAlpha = 1;
      } else {
        ctx.fillText('🧑', cu.x, cu.y + bob);
      }
    }

    // particles
    for (var p = 0; p < particles.length; p++) {
      var pt = particles[p];
      ctx.globalAlpha = 1 - pt.t / pt.life;
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, 6.29); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // HUD
    var timeLeft = Math.max(0, Math.ceil(GAME_LEN - elapsed));
    ctx.textAlign = 'left'; ctx.font = '900 20px -apple-system, sans-serif';
    ctx.fillStyle = '#4ade80'; ctx.fillText('✓ ' + score, 16, 34);
    ctx.fillStyle = '#f87171'; ctx.fillText('✕ ' + lost, 90, 34);
    ctx.textAlign = 'right'; ctx.fillStyle = timeLeft <= 10 ? '#f87171' : '#e8e8f0';
    ctx.fillText('⏱ ' + timeLeft + 's', W - 16, 34);
    ctx.textAlign = 'center';
  }

  var raf = null, lastT = 0;
  function loop(t) {
    if (!running) return;
    var dt = Math.min((t - lastT) / 1000, 0.05); lastT = t;
    update(dt); draw();
    raf = requestAnimationFrame(loop);
  }

  function startGame() {
    customers = []; leaks = []; particles = [];
    score = 0; plugged = 0; lost = 0;
    lastCustSpawn = 0; lastLeakSpawn = 0;
    document.getElementById('start-screen').hidden = true;
    document.getElementById('end-screen').hidden = true;
    running = true; startTime = performance.now(); lastT = startTime;
    raf = requestAnimationFrame(loop);
  }

  function rankFor(s) {
    if (s <= 10) return '🪣 Leaky Bucket';
    if (s <= 20) return '🔧 Getting There';
    return '🏆 Leakproof Legend';
  }

  function endGame() {
    running = false; cancelAnimationFrame(raf);
    document.getElementById('end-score').textContent = score;
    document.getElementById('end-rank').textContent = rankFor(score);
    document.getElementById('end-screen').hidden = false;
  }

  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('again-btn').addEventListener('click', startGame);
})();
</script>
</body>
</html>
